[workspace]
members = [
    "crates/godseed_core",
    "crates/godseed_cli",
]
resolver = "2"

[workspace.dependencies]
bevy_ecs = { version = "0.15.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
crc32fast = "1.4"
rand = "0.8"
rand_chacha = "0.3"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
fnv = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
